spring:
  application:
    name: katibu-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS"]
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: core-service
          uri: ${CORE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/**

server:
  port: ${GATEWAY_PORT:8080}

logging:
  level:
    org.springframework.cloud.gateway: INFO
