spring:
  application:
    name: katibu-gateway
  cloud:
    gateway:
      routes:
        - id: core-service
          uri: ${CORE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/**

server:
  port: ${GATEWAY_PORT:8080}

app:
  # Comma-separated list of allowed origins. Use * for development.
  # Production: https://katibu.my,https://www.katibu.my
  allowed-origins: ${ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
