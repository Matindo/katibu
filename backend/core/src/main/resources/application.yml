spring:
  application:
    name: katibu-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/katibu}
    username: ${DB_USERNAME:katibu}
    password: ${DB_PASSWORD:katibu}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8081}

app:
  jwt:
    # Must be at least 256 bits (32 chars). Override in production via JWT_SECRET env var.
    secret: ${JWT_SECRET:katibu-default-dev-secret-change-in-prod-min32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:katibu-files}

  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.katibu: DEBUG
    org.springframework.security: INFO
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG
