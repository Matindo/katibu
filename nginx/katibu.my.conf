# This file is kept for reference only.
# katibu.my is managed by Nginx Proxy Manager (NPM).
#
# NPM proxy host settings for katibu.my:
#   Forward Hostname / IP : 127.0.0.1
#   Forward Port          : (port where you serve the built frontend, e.g. a static file server)
#   OR serve frontend/dist/ directly from NPM's "Static Files" option.
#
# Enable SSL in NPM using Let's Encrypt.
#
# REQUIRED — add this to the "Advanced" tab → "Custom Nginx Configuration" field:
#
#   location / {
#       try_files $uri $uri/ /index.html;
#   }
#
# This is needed because Vue Router runs in history mode. Without it, any URL
# opened directly (e.g. katibu.my/projects/123) returns a 404 from the web server
# instead of letting Vue Router handle it client-side.
