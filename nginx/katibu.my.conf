# This file is kept for reference only.
# katibu.my is managed by Nginx Proxy Manager (NPM).
#
# The frontend runs as a Docker container with its own nginx inside.
# NPM proxies traffic to that container.
#
# NPM proxy host settings for katibu.my:
#   Forward Hostname / IP : 127.0.0.1
#   Forward Port          : 3000
#   Scheme                : http
#
# Enable SSL in NPM using Let's Encrypt (SSL tab).
#
# REQUIRED — add this to the "Advanced" tab → "Custom Nginx Configuration" field:
#
#   location / {
#       try_files $uri $uri/ /index.html;
#   }
#
# This is needed because Vue Router runs in history mode. Without it, any URL
# opened directly (e.g. katibu.my/projects/123) returns a 404 instead of letting
# Vue Router handle it client-side.
#
# Note: the frontend container's internal nginx already includes this directive.
# The snippet above is a safety net for NPM's own proxy layer.
