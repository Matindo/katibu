name: CI / Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}/katibu

jobs:
  # ─── Test Frontend ────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install test dependencies
        run: npm install --save-dev @vue/vue2-jest @vue/test-utils@1 --legacy-peer-deps

      - name: Run unit tests
        run: npm run test:unit -- --ci --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ─── Test Backend ─────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: katibu_test
          POSTGRES_USER: katibu
          POSTGRES_PASSWORD: katibu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        run: mvn -B test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/katibu_test
          DB_USERNAME: katibu
          DB_PASSWORD: katibu

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ─── Build & Push Docker Images (parallel matrix) ────────────────────
  build-push:
    name: Build & Push – ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    # Only push images on merges to main (not on pull request builds)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            image: frontend
            build_args: |
              VUE_APP_API_URL=https://api.katibu.my
          - service: core
            context: .
            dockerfile: backend/core/Dockerfile
            image: core
            build_args: ""
          - service: gateway
            context: .
            dockerfile: backend/gateway/Dockerfile
            image: gateway
            build_args: ""
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
